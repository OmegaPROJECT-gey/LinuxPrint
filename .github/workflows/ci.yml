name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Установка системных зависимостей (GTK4, libadwaita, CUPS, SANE)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev \
            cups-client sane-utils poppler-utils \
            tesseract-ocr tesseract-ocr-rus

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Тесты
        run: cargo test --workspace
      # Живые тесты (cupsd, реальные lpstat/scanimage) выполняются только
      # локально: cargo test -p linuxprinterg-core -- --ignored --test-threads=1

  build:
    name: Сборка release-бинарника
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Сборка
        run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: linuxprinterg
          path: target/release/linuxprinterg

  packages:
    name: Установщики .deb / .rpm
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Сборка release
        run: cargo build --release --workspace
      - name: Проверка иконок в дереве
        run: test -f crates/linuxprinterg/data/icons/hicolor/scalable/apps/org.linuxprinterg.LinuxPrinterG.svg
      - name: Сборка пакетов (nfpm скачивается автоматически)
        run: ./scripts/build-packages.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            dist/*.deb
            dist/*.rpm

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    needs: check
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: linuxprinterg.flatpak
          manifest-path: crates/linuxprinterg/data/org.linuxprinterg.LinuxPrinterG.flatpak.yml
          artifact-name: linuxprinterg-x86_64.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
