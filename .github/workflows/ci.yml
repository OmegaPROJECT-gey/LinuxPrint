name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Установка системных зависимостей (GTK4, libadwaita, CUPS, SANE)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-0-dev \
            cups-client sane-utils poppler-utils \
            tesseract-ocr tesseract-ocr-rus

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Тесты
        run: cargo test --workspace

      - name: Интеграционные тесты (внешние утилиты)
        run: cargo test -p linuxprinterg-core -- --ignored --test-threads=1

  build:
    name: Сборка release-бинарника
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Сборка
        run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: linuxprinterg
          path: target/release/linuxprinterg
