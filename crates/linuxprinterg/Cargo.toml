[package]
name = "linuxprinterg"
description = "LinuxPrinterG — единый центр управления печатью и сканированием"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
linuxprinterg-core = { path = "../linuxprinterg-core" }
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
async-channel = "2"
tracing = "0.1"

[[bin]]
name = "linuxprinterg"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "LinuxPrinterG contributors"
copyright = "2026, LinuxPrinterG contributors"
extended-description = """
LinuxPrinterG — быстрый минималистичный центр управления печатью и
сканированием для Linux. Работает со системными службами CUPS и SANE
(включая eSCL/AirScan) и использует уже установленные драйверы."""
depends = "cups-client, sane-utils, poppler-utils"
section = "utils"
priority = "optional"

